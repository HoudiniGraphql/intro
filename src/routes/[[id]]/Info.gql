query Info($id: Int! = 1) {
	species(id: $id) {
		id
		pokedexNumber
		name
		flavor_text
		favorite
		evolution_chain {
			...SpeciesPreview
		}
		...SpriteInfo

		moves(first: 1) @paginate(mode: SinglePage) {
			edges {
				node {
					...MoveDisplay
				}
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
			}
		}
	}
	favorites @list(name: "FavoriteSpecies") {
		...FavoritePreview
	}
}
