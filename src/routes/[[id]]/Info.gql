query Info($id: Int! = 1) @loading {
	species(id: $id) {
		id
		pokedexNumber
		name
		flavor_text
		favorite
		evolution_chain {
			id
			...SpeciesPreview
		}
		...SpriteInfo

		moves(first: 1) @paginate(mode: SinglePage) @loading(count: 1) {
			edges @loading(count: 3) {
				node {
					...MoveDisplay
				}
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
			}
		}
	}
	favorites @list(name: "FavoriteSpecies") {
		id
		...FavoritePreview
	}
}
