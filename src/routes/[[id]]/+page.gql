query Info($id: Int! = 1) @loading {
	species(id: $id, delay: 500)  {
		id 
		pokedexNumber
		name
		flavor_text
		favorite
		...SpriteInfo
		evolution_chain {
			id
			...SpeciesPreview
		}
		moves(first: 1) @paginate(mode: SinglePage) {
			edges @loading(count: 1) {
				node {
					...MoveDisplay
				}
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
			}
		}
	}
}
