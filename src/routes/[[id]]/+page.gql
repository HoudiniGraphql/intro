query Info($id: Int! = 1) @loading {
	species(id: $id)  {
		id 
		pokedexNumber
		name
		flavor_text
		favorite
		...SpriteInfo
		evolution_chain  {
			id
			...SpeciesPreview 
		}
		moves(first: 1) @paginate(mode: SinglePage) @loading(count:1){
			edges @loading(count:3){
				node {
					...MoveDisplay 
				}
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
			}
		}
	}
	favorites @list(name: "FavoriteSpecies") {
		id 
		...FavoritePreview 
	}
}
